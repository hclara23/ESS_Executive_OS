steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/elio-api:$SHORT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/elio-api:$SHORT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'gcloud'
  args:
    - 'run'
    - 'deploy'
    - 'elio-api'
    - '--image'
    - 'gcr.io/$PROJECT_ID/elio-api:$SHORT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    # NOTE: use Secret Manager / --update-secrets in production instead of embedding secrets
    - '--set-env-vars'
    - 'ELIO_JWT_SECRET=__REPLACE_ME__'

images:
- 'gcr.io/$PROJECT_ID/elio-api:$SHORT_SHA'

timeout: 1200s
