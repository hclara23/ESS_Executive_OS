services:
  postgres:
    image: postgres:16-alpine
    container_name: ess_postgres
    environment:
      POSTGRES_DB: ess_ags
      POSTGRES_USER: ess_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ess_secure_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ess_user -d ess_ags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ess_network

  redis:
    image: redis:7-alpine
    container_name: ess_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ess_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ess_api
    environment:
      DATABASE_URL: postgresql+asyncpg://ess_user:${DB_PASSWORD:-ess_secure_password_change_me}@postgres:5432/ess_ags
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      WP_URL: ${WP_URL}
      WP_JWT_SECRET: ${WP_JWT_SECRET}
      WP_USERNAME: ${WP_USERNAME}
      WP_PASSWORD: ${WP_PASSWORD}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID}
      GA4_CREDENTIALS: ${GA4_CREDENTIALS}
    ports:
      - "127.0.0.1:${ESS_API_PORT:-18080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ess_network
      - platform_edge

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ess_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ess_user:${DB_PASSWORD:-ess_secure_password_change_me}@postgres:5432/ess_ags
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      WP_URL: ${WP_URL}
      WP_JWT_SECRET: ${WP_JWT_SECRET}
      WP_USERNAME: ${WP_USERNAME}
      WP_PASSWORD: ${WP_PASSWORD}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID}
      GA4_CREDENTIALS: ${GA4_CREDENTIALS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p = Path('/tmp/ess-worker-heartbeat'); raise SystemExit(0 if p.exists() and time.time() - p.stat().st_mtime < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - ess_network

  n8n:
    image: n8nio/n8n:latest
    container_name: ess_n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=ess_ags
      - DB_POSTGRESDB_USER=ess_user
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-ess_secure_password_change_me}
      - EXECUTIONS_MODE=${N8N_EXECUTIONS_MODE:-regular}
      - QUEUE_BULL_REDIS_URL=redis://redis:6379/1
    ports:
      - "127.0.0.1:${ESS_N8N_PORT:-15678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - ess_network
      - platform_edge

  nginx:
    image: nginx:alpine
    container_name: ess_nginx
    profiles:
      - legacy_public
    ports:
      - "127.0.0.1:${ESS_NGINX_PORT:-18081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - n8n
    networks:
      - ess_network
      - platform_edge

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  ess_network:
    driver: bridge
  platform_edge:
    external: true
    name: ${EDGE_NETWORK:-platform_edge}
