name: ${COMPOSE_PROJECT_NAME:-elio}

services:
  api:
    build: .
    command: uvicorn server.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      PORT: 8000
      ELIO_PG_URI: ${ELIO_PG_URI:-postgresql://elio:elio@postgres:5432/elio}
      ELIO_LOCAL_BASE_URL: ${ELIO_LOCAL_BASE_URL:-http://ollama:11434/v1}
      ELIO_SUBAGENT_URL: ${ELIO_SUBAGENT_URL:-http://subagent:8010}
      ELIO_RUN_BACKGROUND_WORKER: ${ELIO_RUN_BACKGROUND_WORKER:-true}
    ports:
      - "${ELIO_API_PORT:-8000}:8000"
    networks:
      elio_core:
        aliases:
          - api
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      subagent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  subagent:
    build: .
    command: uvicorn server.subagent:app --host 0.0.0.0 --port 8010
    env_file:
      - .env
    environment:
      ELIO_LLM_MODE: ${ELIO_SUBAGENT_LLM_MODE:-local}
      ELIO_LOCAL_BASE_URL: ${ELIO_LOCAL_BASE_URL:-http://ollama:11434/v1}
      ELIO_RUN_BACKGROUND_WORKER: "false"
    expose:
      - "8010"
    networks:
      elio_core:
        aliases:
          - subagent
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "${ELIO_OLLAMA_BIND_IP:-127.0.0.1}:${ELIO_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      elio_core:
        aliases:
          - ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: elio
      POSTGRES_PASSWORD: elio
      POSTGRES_DB: elio
    ports:
      - "127.0.0.1:${ELIO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      elio_core:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elio -d elio"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama_data:
  pg_data:

networks:
  elio_core:
    name: ${COMPOSE_PROJECT_NAME:-elio}_core
